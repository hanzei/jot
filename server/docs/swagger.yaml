basePath: /api/v1
definitions:
  apierr.Code:
    enum:
    - validation_failed
    - unauthorized
    - forbidden
    - not_found
    - method_not_allowed
    - conflict
    - request_too_large
    - limit_exceeded
    - rate_limited
    - bad_request
    - internal
    - invalid_credentials
    - session_required
    - registration_disabled
    - local_login_disabled
    - incorrect_password
    - username_taken
    - cannot_share_with_self
    - already_shared
    - label_name_taken
    - last_admin
    - cannot_delete_self
    - sso_identity_linked
    - would_strand_account
    - label_name_too_long
    - item_limit_reached
    - image_limit_reached
    - pat_limit_reached
    - unsupported_image_type
    - invalid_image
    - invalid_import_file
    type: string
    x-enum-comments:
      CodeAlreadyShared: 409 — the note is already shared with that user.
      CodeBadRequest: any other 4xx.
      CodeCannotDeleteSelf: 403 — admins cannot delete their own account.
      CodeCannotShareWithSelf: 400 — a note cannot be shared with its owner.
      CodeConflict: 409 — the request conflicts with current state (duplicate ID,
        concurrent modification, …).
      CodeForbidden: 403 — authenticated, but not allowed to do this.
      CodeImageLimitReached: 422 — the note would exceed the per-note image cap.
      CodeIncorrectPassword: 403 — the current password given to change a password
        is wrong.
      CodeInternal: any 5xx. The message is always masked.
      CodeInvalidCredentials: 401 from login — wrong username or password.
      CodeInvalidImage: 400 — the uploaded file claims an accepted type but does not
        decode as an image.
      CodeInvalidImportFile: 400 — the import file is not a readable export of the
        chosen import type.
      CodeItemLimitReached: 422 — the note would exceed the per-note item cap.
      CodeLabelNameTaken: 400 from rename, 409 from a create with a client-supplied
        ID — the user already has a label with this name.
      CodeLabelNameTooLong: 422 — the label name exceeds the label name length limit.
      CodeLastAdmin: 409 — the change would leave the server without an admin.
      CodeLimitExceeded: 422 — a resource cap or length limit was exceeded.
      CodeLocalLoginDisabled: 403 from register, login, and password change — password
        login is turned off; use SSO.
      CodeMethodNotAllowed: 405 — the route exists but not for this method.
      CodeNotFound: 404 — the resource or route does not exist (or is not visible
        to the caller).
      CodePATLimitReached: 422 — the user already holds the maximum number of personal
        access tokens.
      CodeRateLimited: 429 — too many requests; honor Retry-After.
      CodeRegistrationDisabled: 403 — self-registration is turned off.
      CodeRequestTooLarge: 413 — the request body exceeds the endpoint's limit.
      CodeSSOIdentityLinked: 409 — the SSO identity belongs to another account.
      CodeSessionRequired: 403 — the endpoint needs a browser session, and the request
        authenticated with a personal access token.
      CodeUnauthorized: 401 — missing, invalid, or expired credentials.
      CodeUnsupportedImageType: 400 — the uploaded file is not one of the endpoint's
        accepted image types.
      CodeUsernameTaken: 409 — another account already has this username.
      CodeValidationFailed: 400 — malformed or invalid request input.
      CodeWouldStrandAccount: 422 — unlinking SSO would leave the account with no
        way to sign in.
    x-enum-descriptions:
    - 400 — malformed or invalid request input.
    - 401 — missing, invalid, or expired credentials.
    - 403 — authenticated, but not allowed to do this.
    - 404 — the resource or route does not exist (or is not visible to the caller).
    - 405 — the route exists but not for this method.
    - 409 — the request conflicts with current state (duplicate ID, concurrent modification,
      …).
    - 413 — the request body exceeds the endpoint's limit.
    - 422 — a resource cap or length limit was exceeded.
    - 429 — too many requests; honor Retry-After.
    - any other 4xx.
    - any 5xx. The message is always masked.
    - 401 from login — wrong username or password.
    - 403 — the endpoint needs a browser session, and the request authenticated with
      a personal access token.
    - 403 — self-registration is turned off.
    - 403 from register, login, and password change — password login is turned off;
      use SSO.
    - 403 — the current password given to change a password is wrong.
    - 409 — another account already has this username.
    - 400 — a note cannot be shared with its owner.
    - 409 — the note is already shared with that user.
    - 400 from rename, 409 from a create with a client-supplied ID — the user already
      has a label with this name.
    - 409 — the change would leave the server without an admin.
    - 403 — admins cannot delete their own account.
    - 409 — the SSO identity belongs to another account.
    - 422 — unlinking SSO would leave the account with no way to sign in.
    - 422 — the label name exceeds the label name length limit.
    - 422 — the note would exceed the per-note item cap.
    - 422 — the note would exceed the per-note image cap.
    - 422 — the user already holds the maximum number of personal access tokens.
    - 400 — the uploaded file is not one of the endpoint's accepted image types.
    - 400 — the uploaded file claims an accepted type but does not decode as an image.
    - 400 — the import file is not a readable export of the chosen import type.
    x-enum-varnames:
    - CodeValidationFailed
    - CodeUnauthorized
    - CodeForbidden
    - CodeNotFound
    - CodeMethodNotAllowed
    - CodeConflict
    - CodeRequestTooLarge
    - CodeLimitExceeded
    - CodeRateLimited
    - CodeBadRequest
    - CodeInternal
    - CodeInvalidCredentials
    - CodeSessionRequired
    - CodeRegistrationDisabled
    - CodeLocalLoginDisabled
    - CodeIncorrectPassword
    - CodeUsernameTaken
    - CodeCannotShareWithSelf
    - CodeAlreadyShared
    - CodeLabelNameTaken
    - CodeLastAdmin
    - CodeCannotDeleteSelf
    - CodeSSOIdentityLinked
    - CodeWouldStrandAccount
    - CodeLabelNameTooLong
    - CodeItemLimitReached
    - CodeImageLimitReached
    - CodePATLimitReached
    - CodeUnsupportedImageType
    - CodeInvalidImage
    - CodeInvalidImportFile
  apierr.ErrorDetail:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/apierr.Code'
        description: Code is stable and machine-readable; clients switch on it.
        example: not_found
      message:
        description: |-
          Message is human-readable English, for logs and as a fallback. Masked
          to "internal server error" for 5xx responses.
        example: note not found
        type: string
    type: object
  apierr.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/apierr.ErrorDetail'
    type: object
  handlers.AddLabelRequest:
    properties:
      id:
        description: |-
          ID is an optional client-supplied label ID. When provided it is used as the
          label's primary key so an offline-created label can be replayed idempotently:
          a replay whose original create already committed is rejected with 409
          instead of inserting a duplicate. When empty the server generates one.
        type: string
      name:
        type: string
    type: object
  handlers.AuthResponse:
    properties:
      settings:
        $ref: '#/definitions/models.UserSettings'
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.ChangePasswordRequest:
    properties:
      current_password:
        description: |-
          CurrentPassword is required unless the account has no password yet
          (has_password is false, e.g. an SSO-provisioned user), in which case it
          is ignored and the request sets the first password.
        type: string
      new_password:
        type: string
    type: object
  handlers.ConvertNoteTypeRequest:
    properties:
      base_version:
        description: |-
          BaseVersion enables optimistic concurrency, matching UpdateNoteRequest:
          when set, the conversion is rejected with 409 unless the note's current
          version still matches it.
        type: integer
      content:
        type: string
      items:
        items:
          $ref: '#/definitions/handlers.CreateNoteItem'
        maxItems: 500
        type: array
      note_type:
        $ref: '#/definitions/models.NoteType'
      title:
        description: |-
          Title is the converted list's title, which the client promotes from a
          leading heading in the text content. Omitting it leaves the note
          untitled — the behavior every client had before the field existed.
        type: string
    type: object
  handlers.CreateNoteItem:
    properties:
      completed:
        type: boolean
      id:
        description: |-
          ID is an optional client-supplied item ID. When provided it is honored so
          the item keeps a stable identity for later per-item updates and offline
          replay; when empty the server generates one.
        type: string
      indent_level:
        type: integer
      position:
        type: integer
      text:
        type: string
    type: object
  handlers.CreateNoteItemRequest:
    properties:
      assigned_to:
        type: string
      completed:
        type: boolean
      id:
        type: string
      parent_id:
        description: |-
          ParentID nests the item under a top-level item in the same note. Empty or
          omitted means the item is top-level. Replaces the former indent_level.
        type: string
      position:
        type: integer
      text:
        type: string
    type: object
  handlers.CreateNoteRequest:
    properties:
      color:
        type: string
      content:
        type: string
      id:
        description: |-
          ID is an optional client-supplied note ID. When provided it is used as the
          note's primary key so an offline-created note can be replayed idempotently:
          a replay whose original create already committed is rejected with 409
          instead of inserting a duplicate. When empty the server generates one.
        type: string
      items:
        items:
          $ref: '#/definitions/handlers.CreateNoteItem'
        type: array
      labels:
        items:
          type: string
        type: array
      note_type:
        $ref: '#/definitions/models.NoteType'
      title:
        type: string
    type: object
  handlers.CreateUserRequest:
    properties:
      password:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  handlers.DeleteNoteItemsRequest:
    properties:
      item_ids:
        items:
          type: string
        type: array
    required:
    - item_ids
    type: object
  handlers.DeleteUserNotesResponse:
    properties:
      deleted:
        type: integer
    type: object
  handlers.DuplicateNoteRequest:
    properties:
      id:
        type: string
      item_ids:
        additionalProperties:
          type: string
        type: object
    type: object
  handlers.EmptyTrashResponse:
    properties:
      deleted:
        type: integer
    type: object
  handlers.ImportResponse:
    properties:
      errors:
        items:
          type: string
        type: array
      imported:
        type: integer
      skipped:
        type: integer
    type: object
  handlers.LabelCount:
    properties:
      count:
        type: integer
      label_id:
        type: string
    type: object
  handlers.LabelCountsResponse:
    properties:
      counts:
        items:
          $ref: '#/definitions/handlers.LabelCount'
        type: array
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handlers.NativeExchangeRequest:
    properties:
      code:
        type: string
      code_verifier:
        type: string
    type: object
  handlers.PatchNoteItemRequest:
    properties:
      assigned_to:
        type: string
      completed:
        type: boolean
      parent_id:
        description: ParentID, when present, re-parents the item ("" makes it top-level).
        type: string
      position:
        type: integer
      text:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handlers.RenameLabelRequest:
    properties:
      name:
        type: string
    type: object
  handlers.ReorderNoteItemsRequest:
    properties:
      item_ids:
        items:
          type: string
        type: array
    type: object
  handlers.ReorderNotesRequest:
    properties:
      note_ids:
        items:
          type: string
        type: array
    type: object
  handlers.SessionResponse:
    properties:
      browser:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      is_current:
        type: boolean
      os:
        type: string
    type: object
  handlers.SetNoteItemsCompletedRequest:
    properties:
      completed:
        description: |-
          Completed is a pointer so an omitted field is rejected rather than
          silently decoding to false.
        type: boolean
      item_ids:
        items:
          type: string
        type: array
    required:
    - completed
    - item_ids
    type: object
  handlers.SetUserPasswordRequest:
    properties:
      new_password:
        type: string
    required:
    - new_password
    type: object
  handlers.ShareNoteRequest:
    properties:
      user_id:
        type: string
    type: object
  handlers.ToggleNoteItemCompletedRequest:
    properties:
      completed:
        description: |-
          Completed is a pointer so an omitted field is rejected by the handler
          rather than silently decoding to false and unchecking the item.
        type: boolean
    type: object
  handlers.UpdateNoteRequest:
    properties:
      archived:
        type: boolean
      base_version:
        description: |-
          BaseVersion enables optimistic concurrency for shared title/content
          changes: when those fields are changed and this is set, the update is
          rejected with 409 unless the note's current version still matches it.
          Per-user-only fields (color, pinned, archived, checked_items_collapsed)
          ignore this value. When omitted, shared-content updates behave as
          last-write-wins writes.
        type: integer
      checked_items_collapsed:
        type: boolean
      color:
        type: string
      content:
        type: string
      pinned:
        type: boolean
      title:
        type: string
    type: object
  handlers.UpdateUserRequest:
    properties:
      first_name:
        type: string
      language:
        enum:
        - system
        - en
        - de
        - es
        - fr
        - pt
        - it
        - nl
        - pl
        type: string
      last_name:
        type: string
      note_sort:
        enum:
        - manual
        - updated_at
        - created_at
        type: string
      theme:
        enum:
        - system
        - light
        - dark
        type: string
      username:
        type: string
    type: object
  handlers.UpdateUserRoleRequest:
    properties:
      role:
        type: string
    type: object
  handlers.UserInfo:
    properties:
      first_name:
        type: string
      has_profile_icon:
        type: boolean
      id:
        type: string
      last_name:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  handlers.UserListResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  handlers.createPATRequest:
    properties:
      name:
        type: string
    type: object
  handlers.patResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      token:
        type: string
    type: object
  models.AdminLabelStats:
    properties:
      note_associations:
        type: integer
      total:
        type: integer
    type: object
  models.AdminListItemStats:
    properties:
      assigned:
        type: integer
      completed:
        type: integer
      total:
        type: integer
    type: object
  models.AdminNoteStats:
    properties:
      archived:
        type: integer
      list:
        type: integer
      text:
        type: integer
      total:
        type: integer
      trashed:
        type: integer
    type: object
  models.AdminSharingStats:
    properties:
      share_links:
        type: integer
      shared_notes:
        type: integer
    type: object
  models.AdminStats:
    properties:
      labels:
        $ref: '#/definitions/models.AdminLabelStats'
      list_items:
        $ref: '#/definitions/models.AdminListItemStats'
      notes:
        $ref: '#/definitions/models.AdminNoteStats'
      sharing:
        $ref: '#/definitions/models.AdminSharingStats'
      storage:
        $ref: '#/definitions/models.AdminStorageStats'
      users:
        $ref: '#/definitions/models.AdminUserStats'
    type: object
  models.AdminStorageStats:
    properties:
      database_size_bytes:
        type: integer
      image_count:
        type: integer
      images_size_bytes:
        type: integer
    type: object
  models.AdminUserStats:
    properties:
      admins:
        type: integer
      total:
        type: integer
    type: object
  models.Label:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.Note:
    properties:
      archived:
        type: boolean
      checked_items_collapsed:
        type: boolean
      color:
        type: string
      content:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/models.NoteImage'
        type: array
      is_shared:
        type: boolean
      items:
        items:
          $ref: '#/definitions/models.NoteItem'
        type: array
      labels:
        items:
          $ref: '#/definitions/models.Label'
        type: array
      note_type:
        $ref: '#/definitions/models.NoteType'
      pinned:
        type: boolean
      position:
        type: integer
      shared_with:
        items:
          $ref: '#/definitions/models.NoteShare'
        type: array
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      version:
        description: |-
          Version is an optimistic-concurrency counter bumped on every shared-content
          (title/content) change. Clients echo the version their edit was based on as
          base_version on update so a stale write can be rejected (issue #489).
        type: integer
    type: object
  models.NoteImage:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      filename:
        type: string
      height:
        type: integer
      id:
        type: string
      width:
        type: integer
    type: object
  models.NoteItem:
    properties:
      assigned_to:
        type: string
      completed:
        type: boolean
      created_at:
        type: string
      id:
        type: string
      note_id:
        type: string
      parent_id:
        description: |-
          ParentID is the item this one is nested under, or nil for a top-level
          item. It replaces the former indent_level column: a group is a top-level
          item plus the children that reference it. Nesting is capped at one level,
          so a parent always has ParentID == nil.
        type: string
      position:
        type: integer
      text:
        type: string
      updated_at:
        type: string
    type: object
  models.NoteShare:
    properties:
      created_at:
        type: string
      first_name:
        type: string
      has_profile_icon:
        type: boolean
      id:
        type: string
      last_name:
        type: string
      note_id:
        type: string
      shared_by_user_id:
        type: string
      shared_with_user_id:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  models.NoteType:
    enum:
    - text
    - list
    type: string
    x-enum-varnames:
    - NoteTypeText
    - NoteTypeList
  models.User:
    properties:
      created_at:
        type: string
      first_name:
        type: string
      has_password:
        type: boolean
      has_profile_icon:
        type: boolean
      has_sso_linked:
        type: boolean
      id:
        type: string
      last_name:
        type: string
      role:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  models.UserSettings:
    properties:
      language:
        type: string
      note_sort:
        enum:
        - manual
        - updated_at
        - created_at
        type: string
      theme:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  server.aboutResponse:
    properties:
      build_time:
        type: string
      commit:
        type: string
      go_version:
        type: string
      version:
        type: string
    type: object
  server.configResponse:
    properties:
      password_min_length:
        type: integer
      registration_enabled:
        type: boolean
      sso:
        $ref: '#/definitions/server.ssoConfig'
      upload_max_bytes:
        type: integer
    type: object
  server.ssoConfig:
    properties:
      enabled:
        type: boolean
      local_login_enabled:
        type: boolean
      provider_name:
        type: string
    type: object
info:
  contact:
    name: Jot Project
    url: https://github.com/hanzei/jot
  description: Self-hosted note-taking application API. Health probes are available
    at root paths `/livez` and `/readyz` (outside `/api/v1`).
  license:
    name: MIT
  title: Jot API
  version: "1.0"
paths:
  /about:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.aboutResponse'
      security:
      - CookieAuth: []
      summary: Get server version and build info
      tags:
      - system
  /admin/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AdminStats'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get admin system stats (admin only)
      tags:
      - admin
  /admin/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserListResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - CookieAuth: []
      summary: List all users (admin only)
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: New user details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "409":
          description: username already taken
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Create a user (admin only)
      tags:
      - admin
  /admin/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: no content
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "409":
          description: cannot demote the last admin
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete a user (admin only)
      tags:
      - admin
  /admin/users/{id}/notes:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeleteUserNotesResponse'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete all notes owned by a user (admin only)
      tags:
      - admin
  /admin/users/{id}/password:
    put:
      consumes:
      - application/json
      description: Sets a new password for the given user without requiring the user's
        current password. All of the target user's existing sessions are invalidated.
        Intended for administrative account recovery.
      parameters:
      - description: User ID
