version: 2

# Immutable releases are enabled on this repository, so a published release
# rejects every asset upload with "422 Cannot upload assets to an immutable
# release". GoReleaser already handles that on its own — it creates the release
# as a draft, uploads the archives, and undrafts it afterwards — but only when
# it is the one creating the release. A release created from the GitHub UI is
# published the moment its tag is pushed, and GoReleaser then reuses it as-is
# and every upload fails. Cut releases by pushing a tag; see the Releasing
# section of the README.

project_name: jot

builds:
  - id: server
    dir: server
    # The SQLite driver is pure Go (modernc.org/sqlite), so the server needs no
    # CGO and no C cross-toolchain for arm64. Keep this in sync with the
    # Dockerfile's backend-builder stage, which builds with CGO_ENABLED=0 too.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X 'github.com/hanzei/jot/server/internal/server.version={{.Version}}'
      - -X 'github.com/hanzei/jot/server/internal/server.commit={{.ShortCommit}}'
      - -X 'github.com/hanzei/jot/server/internal/server.buildTime={{.Date}}'

  - id: jotctl
    dir: server
    main: ./cmd/jotctl
    binary: jotctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X 'github.com/hanzei/jot/server/cmd/jotctl/cmd.version={{.Version}}'
      - -X 'github.com/hanzei/jot/server/cmd/jotctl/cmd.commit={{.ShortCommit}}'
      - -X 'github.com/hanzei/jot/server/cmd/jotctl/cmd.buildTime={{.Date}}'

archives:
  - id: server
    ids: [server]
    formats: [tar.gz]
  - id: jotctl
    ids: [jotctl]
    name_template: "jotctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  # Keep the notes identical to GitHub's own "Generate release notes" output,
  # which is what every release up to v0.8.7 used. `sort` and `filters` are
  # ignored in this mode, so they are deliberately absent.
  use: github-native
