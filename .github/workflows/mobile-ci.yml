name: Mobile — CI

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    paths:
      - "mobile/**"
      - "shared/**"
      # The translations job runs `task check-translations`, so the Taskfile
      # and the scripts it calls are inputs to this workflow too.
      - "Taskfile.yml"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./mobile

      - name: Run ESLint
        run: npm run lint
        working-directory: ./mobile

      - name: Run TypeScript type checking
        run: npm run typecheck
        working-directory: ./mobile

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x

      - name: Install dependencies
        run: npm ci
        working-directory: ./webapp

      - name: Check translations
        run: task check-translations

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./mobile

      - name: Run tests with coverage
        run: npm test -- --ci --coverage
        working-directory: ./mobile

      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: mobile/coverage/
          retention-days: 7

  # Syntax-check the Maestro flows on every PR. This needs Maestro and Java but
  # NO emulator, so it lives here rather than in mobile-e2e.yml: a mistyped
  # command or property fails in seconds instead of being buried in a 15-minute
  # emulator run. It cannot tell you a selector stopped matching — only a real
  # device run does.
  flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Maestro is a Gradle-style start script that bundles no JRE.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x

      # The Maestro pin lives in scripts/check-maestro.sh; read it back rather
      # than duplicate the version here.
      - name: Resolve pinned Maestro version
        id: maestro
        run: |
          version="$(sed -n 's/^MAESTRO_VERSION="\([^"]*\)".*/\1/p' scripts/check-maestro.sh)"
          if [ -z "$version" ]; then
            echo "Could not read MAESTRO_VERSION from scripts/check-maestro.sh" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Cache the download so it does not re-fetch per run.
      - name: Cache Maestro
        id: maestro-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.maestro-dist
          key: maestro-${{ steps.maestro.outputs.version }}

      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        # get.maestro.mobile.dev returns 403 through some proxies; the release
        # zip is the reliable source.
        run: |
          curl -fsSL -o /tmp/maestro.zip \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${{ steps.maestro.outputs.version }}/maestro.zip"
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro-dist"

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro-dist/maestro/bin" >> "$GITHUB_PATH"

      - name: Check Maestro flow syntax
        run: task check-mobile-flows
