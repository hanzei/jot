name: Mobile — APK Build

permissions:
  contents: read

# Tag builds are driven by release.yml, which calls this workflow rather than
# letting it fire on its own `push: tags:` trigger — GoReleaser needs the APK
# in hand (as a build artifact) before it creates the release, so the two runs
# have to share one workflow run rather than race independently.
on:
  push:
    branches: [master]
  pull_request:
    paths: ["mobile/**", "shared/**", ".github/workflows/**"]
  workflow_call:
    outputs:
      apk-name:
        description: Name of the uploaded APK build artifact, without the .apk extension.
        value: ${{ jobs.build-apk.outputs.apk-name }}

jobs:
  build-apk:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      apk-name: ${{ steps.apk.outputs.name }}
    # On a v* tag build, expose the tag as APP_VERSION so app.config.js stamps
    # it as the app's version (native versionName + the About screen). Empty on
    # branch/PR builds, where app.json's static version is used instead. Set at
    # job level so both `expo prebuild` and the gradle build see it.
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pre-install NDK and CMake
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci
        working-directory: ./mobile

      - name: Write google-services.json
        run: echo "$GOOGLE_SERVICES_JSON" > mobile/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
        working-directory: ./mobile

      - name: Configure gradle.properties
        run: |
          file=./mobile/android/gradle.properties
          # Set a property to a single value, replacing any existing definition.
          # expo prebuild writes some of these (e.g. reactNativeArchitectures,
          # org.gradle.jvmargs) into the generated file already, so appending would
          # leave a duplicate key whose effective value is ambiguous. Replacing
          # in place guarantees our value is the only one present.
          set_prop() {
            if grep -q "^$1=" "$file"; then
              sed -i "s|^$1=.*|$1=$2|" "$file"
            else
              printf '%s=%s\n' "$1" "$2" >> "$file"
            fi
          }
          # Build only for arm64-v8a to keep CI fast — it is the only ABI we ship.
          set_prop reactNativeArchitectures arm64-v8a
          set_prop org.gradle.jvmargs "-Xmx4g -XX:MaxMetaspaceSize=1g"
          # Reuse task outputs across runs via the Gradle build cache (persisted by
          # gradle/actions/setup-gradle) and build modules in parallel.
          set_prop org.gradle.caching true
          set_prop org.gradle.parallel true
          # Required by expo-modules-autolinking's ExpoAutolinkingPlugin to run the
          # mirror-kotlin-inline-modules command. expo prebuild should set this, but
          # we set it explicitly here to guard against cases where it is absent.
          set_prop expo.inlineModules.watchedDirectories "[]"

      - name: Write keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > ./mobile/android/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Get build date
        id: build-date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build release APK
        # -P reactNativeArchitectures is the React Native Gradle plugin's documented
        # override and takes precedence over gradle.properties, so the build only
        # compiles native code for arm64-v8a. Android lint (lintVital*) is skipped:
        # it adds several minutes and is not needed to produce the APK artifact.
        # EXPO_PUBLIC_* vars are inlined into the JS bundle by Metro during this
        # step, surfacing commit/build-date info in the app's About section.
        run: >-
          ./gradlew assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          -x lintVitalAnalyzeRelease
          -x lintVitalRelease
        working-directory: ./mobile/android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_BUILD_DATE: ${{ steps.build-date.outputs.value }}

      # `app-release.apk` is Gradle's default (module name + variant) and says
      # nothing about what is inside it. Rename so the file identifies its own
      # build:
      #
      #   tag       jot-1.2.3-arm64-v8a.apk
      #   otherwise jot-20260811-e60993f-arm64-v8a.apk
      #
      # A tag build gets the version, which is real and unique, read back
      # through `expo config` rather than app.json so it is the value
      # app.config.js resolved — including the APP_VERSION override — and cannot
      # drift from the versionName baked into the APK.
      #
      # Every other build gets the build date and commit instead. app.json's
      # static version is deliberately *not* used here: it has read 0.1.0 since
      # before v0.8.5 and is still 0.1.0 today, so it looks like a version while
      # tracking nothing. Date-first sorts chronologically, and answers "is this
      # bundle recent?" from the filename alone — the artifact's upload
      # timestamp is visible in the Actions UI but lost the moment the file is
      # downloaded or passed to a tester.
      #
      # The date reuses the instant already stamped into the JS bundle as
      # EXPO_PUBLIC_BUILD_DATE rather than calling `date` a second time, so the
      # name cannot disagree with the About screen across a midnight boundary.
      #
      # The ABI is in the name because this workflow ships arm64-v8a only (see
      # the gradle flags above): an install on any other ABI fails with no other
      # clue why, and the file has to answer that away from this workflow.
      - name: Name the APK
        id: apk
        env:
          BUILD_DATE: ${{ steps.build-date.outputs.value }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            stamp=$(npx expo config --json | jq -r .version)
          else
            day=${BUILD_DATE%%T*}
            stamp="${day//-/}-$(git rev-parse --short HEAD)"
          fi
          name="jot-${stamp}-arm64-v8a"
          mv android/app/build/outputs/apk/release/app-release.apk \
             "android/app/build/outputs/apk/release/${name}.apk"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
        working-directory: ./mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: mobile/android/app/build/outputs/apk/release/${{ steps.apk.outputs.name }}.apk
          retention-days: 7
