name: Webapp — CI

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    paths:
      - "webapp/**"
      - "shared/**"
      # The e2e job below builds and runs the Go server, so a server-only
      # change can break it while server-ci stays green — server-ci has no e2e
      # job. Widening the filter runs the three webapp jobs on server PRs too,
      # which is a couple of runner-minutes against a suite that would
      # otherwise never see the change.
      - "server/**"
      # Every job here goes through `task`, so the Taskfile and the scripts it
      # calls are inputs to this workflow as much as the source is.
      - "Taskfile.yml"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x

      - name: Install dependencies
        working-directory: ./webapp
        run: npm ci

      - name: Run tests
        run: task test-webapp

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x

      - name: Install dependencies
        working-directory: ./webapp
        run: npm ci

      - name: Run linters
        run: task lint-webapp

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x

      - name: Install dependencies
        working-directory: ./webapp
        run: npm ci

      - name: Check translations
        run: task check-translations

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x

      - name: Install dependencies
        working-directory: ./webapp
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./webapp
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: task test-e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: webapp/playwright-report/
          retention-days: 7
