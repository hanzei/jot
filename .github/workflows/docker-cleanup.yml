name: Docker Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete PR image from GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TAG: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail

          # Wait for any in-flight docker-merge run to finish before deleting.
          sleep 180

          # Find the package version ID for the PR tag
          PACKAGE_ERR=$(mktemp)
          VERSION_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/users/hanzei/packages/container/jot/versions" \
            2>"$PACKAGE_ERR" | jq -r --arg tag "$PR_TAG" \
            '.[] | select(.metadata.container.tags[] == $tag) | .id' \
            | head -1 || true)

          if [ -s "$PACKAGE_ERR" ]; then
            echo "Warning: gh api package list returned error: $(cat "$PACKAGE_ERR")"
          fi
          rm -f "$PACKAGE_ERR"

          if [ -n "$VERSION_ID" ]; then
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/users/hanzei/packages/container/jot/versions/$VERSION_ID"
            echo "Deleted ghcr.io/hanzei/jot:${PR_TAG}"
          else
            echo "No image found for ${PR_TAG}, skipping"
          fi

          # A multi-arch manifest list never tags its per-platform children or
          # attestation manifests -- only the top-level index carries the tag.
          # So an untagged version is not necessarily orphaned by this PR's
          # image going away: every other open PR's pr-N tag depends on its
          # own untagged children the same way. Deleting "every untagged
          # version" (the old behaviour here) therefore corrupted whichever
          # other PR images happened to be live when any PR closed.
          #
          # Only delete an untagged version once both hold:
          #   - no remaining tag's manifest index still references its digest
          #   - it is older than 10 minutes, so a concurrent docker-merge run
          #     for another PR that hasn't tagged its index yet is not
          #     mistaken for an orphan
          ALL_VERSIONS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/users/hanzei/packages/container/jot/versions" | jq -s 'add')

          REGISTRY_TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:hanzei/jot:pull&service=ghcr.io" | jq -r .token)
          if [ -z "$REGISTRY_TOKEN" ] || [ "$REGISTRY_TOKEN" = "null" ]; then
            echo "Failed to obtain a GHCR pull token; aborting rather than risk deleting a live manifest" >&2
            exit 1
          fi

          # A failed fetch here must abort the whole cleanup rather than be
          # swallowed: silently treating one tag's manifest as having no
          # children is exactly the false negative that causes its still-live
          # children to be deleted below as "unreferenced". The loop reads
          # from a process substitution rather than a pipe so that `exit 1`
          # inside it terminates the step, not just a subshell.
          REFERENCED=$(mktemp)
          while read -r TAG; do
            curl -fsS \
              -H "Authorization: Bearer $REGISTRY_TOKEN" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/hanzei/jot/manifests/$TAG" \
              | jq -r '.manifests[]?.digest' >> "$REFERENCED"
            if [ "$?" -ne 0 ]; then
              echo "Failed to fetch manifest for tag $TAG; aborting rather than risk deleting a live manifest" >&2
              rm -f "$REFERENCED"
              exit 1
            fi
          done < <(echo "$ALL_VERSIONS" | jq -r '.[] | .metadata.container.tags[]?')

          CUTOFF=$(date -u -d '10 minutes ago' +%s)
          echo "$ALL_VERSIONS" | jq -r '
            .[] | select(.metadata.container.tags | length == 0) |
            "\(.id) \(.name) \(.created_at)"
          ' | while read -r ID DIGEST CREATED_AT; do
            [ -z "$ID" ] && continue
            CREATED_TS=$(date -u -d "$CREATED_AT" +%s)
            if [ "$CREATED_TS" -gt "$CUTOFF" ]; then
              echo "Skipping $DIGEST: created too recently to be sure it's orphaned"
              continue
            fi
            if grep -qxF "$DIGEST" "$REFERENCED"; then
              echo "Keeping $DIGEST: still referenced by a live tag"
              continue
            fi
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/users/hanzei/packages/container/jot/versions/$ID"
            echo "Deleted orphaned untagged version $ID ($DIGEST)"
          done

          rm -f "$REFERENCED"
