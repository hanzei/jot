name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # GoReleaser creates the release itself: draft first, archives uploaded, then
  # undrafted. That is the only order immutable releases accept, and it breaks
  # if the tag already has a *published* release — GoReleaser reuses it and
  # every upload comes back as "422 Cannot upload assets to an immutable
  # release" (this is what happened to v0.8.7). Stop before anything is built or
  # pushed rather than discover it after cross-compiling artifacts that cannot
  # be attached.
  #
  # This is a job of its own so that both publishing jobs gate on the
  # precondition instead of on each other. The Docker images are built from
  # source (see Dockerfile) and consume nothing GoReleaser produces, so the
  # `needs: goreleaser` this replaced bought only the ordering — at the cost of
  # leaving the image build idle for the length of the GoReleaser job, and of
  # putting anything later added ahead of GoReleaser on the images' critical
  # path too. Running them concurrently means a failure in one no longer skips
  # the other, so a GoReleaser failure can leave images pushed for a release
  # still sitting in draft; that draft still accepts uploads, so re-running the
  # workflow completes it.
  #
  # The Android APK is the one asset that *does* need to reach GoReleaser
  # before it runs: it has to be uploaded as a release asset in the same
  # draft-then-undraft sequence, via .goreleaser.yml's release.extra_files, or
  # it hits the same immutable-release 422 as everything else attached after
  # the fact. That is why `goreleaser` (but not `docker`) needs `apk` below —
  # unlike the Docker images, the APK has nowhere else to go.
  check-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check the tag has no published release yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # --repo is explicit because this job has no checkout for `gh` to infer
        # the repository from.
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo absent)
          if [ "$draft" = "false" ]; then
            echo "::error::Release $TAG is already published, so GoReleaser cannot attach its archives to it." \
                 "Releases must be cut by pushing a tag, not from the GitHub Releases page." \
                 "An immutable release's tag cannot be deleted or reused — ship the next patch version instead."
            exit 1
          fi

  # Reusable-workflow call rather than a copy of mobile-apk.yml's job: keeps the
  # build steps (NDK/keystore setup, gradle) defined in exactly one place.
  # `secrets: inherit` passes this workflow's secrets through without needing
  # to enumerate them here, same as the called workflow does for its own
  # push/pull_request triggers.
  apk:
    needs: [check-tag]
    permissions:
      contents: read
    uses: ./.github/workflows/mobile-apk.yml
    secrets: inherit

  goreleaser:
    runs-on: ubuntu-latest
    needs: [check-tag, apk]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      # Downloaded into the path .goreleaser.yml's release.extra_files (and
      # checksum.extra_files) glob against, so GoReleaser attaches it to the
      # release — and includes it in checksums.txt — in the same draft-then-
      # undraft sequence as the jot/jotctl archives.
      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.apk.outputs.apk-name }}
          path: mobile-apk

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: [check-tag]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: hanzei/jot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=stable,enable=${{ !contains(github.ref_name, '-') }}
            type=sha

      - name: Get build date
        id: build-date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=hanzei/jot,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          retention-days: 1

  docker-merge:
    runs-on: ubuntu-latest
    needs: [docker]

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: hanzei/jot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=stable,enable=${{ !contains(github.ref_name, '-') }}
            type=sha

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'hanzei/jot@sha256:%s ' *)
