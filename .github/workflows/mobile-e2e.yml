name: Mobile — Device E2E

permissions:
  contents: read

# Cancel a superseded PR run rather than let an in-flight ~15-minute APK build +
# emulator boot finish after a newer commit has landed. Only PR runs cancel;
# master and workflow_dispatch runs each get a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runs the Maestro smoke flow (mobile/e2e/flows/) against the real app on an
# Android emulator. This is the CI half of the harness landed in #980 — the
# part with no local verification loop, because the Claude Code environment has
# no /dev/kvm.
#
# The emulator job is expensive (~10-20 min), so its PR trigger is scoped to the
# inputs that can actually change its result: the mobile app, the shared package
# it compiles, and this workflow itself. It is deliberately NOT gated on secrets
# (see the build job), so it runs on fork PRs too — those are the contributions
# most worth exercising on a device.
on:
  push:
    branches: ["master"]
  pull_request:
    paths:
      - "mobile/**"
      - "shared/**"
      # The Maestro version pin the jobs read lives here, so a bump must
      # re-exercise the device tests.
      - "scripts/check-maestro.sh"
      # run.sh starts this mock IdP for the SSO flows.
      - "webapp/e2e/fixtures/mock-idp.ts"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch:

jobs:
  # Fast gate for the costly jobs below: a malformed flow fails here in seconds
  # instead of after a ~9-minute APK build and an emulator boot. It cannot tell
  # you a selector stopped matching — only a real run does. This duplicates
  # mobile-ci.yml's `flows` job because a job cannot depend on another workflow's
  # job; the cost is ~one cheap runner-minute, and mobile-ci's copy still covers
  # the broader path set (Taskfile/scripts/other workflows) that does not start
  # this workflow.
  check-flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Maestro is a Gradle-style start script that bundles no JRE.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Task
        uses: ./.github/actions/setup-task

      # The Maestro pin lives in scripts/check-maestro.sh; read it back rather
      # than duplicate the version here.
      - name: Resolve pinned Maestro version
        id: maestro
        run: |
          version="$(sed -n 's/^MAESTRO_VERSION="\([^"]*\)".*/\1/p' scripts/check-maestro.sh)"
          if [ -z "$version" ]; then
            echo "Could not read MAESTRO_VERSION from scripts/check-maestro.sh" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Maestro
        id: maestro-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.maestro-dist
          key: maestro-${{ steps.maestro.outputs.version }}

      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        # get.maestro.mobile.dev returns 403 through some proxies; the release
        # zip is the reliable source.
        run: |
          curl -fsSL -o /tmp/maestro.zip \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${{ steps.maestro.outputs.version }}/maestro.zip"
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro-dist"

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro-dist/maestro/bin" >> "$GITHUB_PATH"

      - name: Check Maestro flow syntax
        run: task check-mobile-flows

  # Builds the APK the emulator job installs. Kept separate from mobile-apk.yml
  # on purpose:
  #
  #   - mobile-apk.yml builds a SIGNED RELEASE, which needs five signing secrets
  #     and therefore carries an `if:` that skips it on fork PRs. An e2e job
  #     inheriting that would silently skip exactly the contributions we most
  #     want to test on a device.
  #   - mobile-apk.yml builds arm64-v8a (right for a phone). On an x86_64
  #     emulator that either runs under slow arm translation or fails to install
  #     outright, depending on the system image (see mobile/CLAUDE.md), so the
  #     device job builds the ABI natively.
  #
  # `assembleRelease` rather than `assembleDebug`: a plain debug APK loads its JS
  # bundle from the Metro dev server at runtime, which does not exist in CI, so
  # the app would open to a blank/red screen and every flow would fail. Expo's
  # generated build.gradle points `buildTypes.release.signingConfig` at the
  # debug keystore it also generates, so `assembleRelease` with no signing env
  # vars produces a Hermes-bundled, debug-signed, standalone APK that installs
  # and runs on the emulator with NO secrets — which is the property we need,
  # and which a bare debug build does not have.
  build-apk:
    runs-on: ubuntu-latest
    needs: check-flows
    steps:
      # On pull_request GitHub checks out the ephemeral merge commit by default;
      # check out the PR head so the built APK matches a reviewable commit. The
      # expression is empty on push/dispatch runs, where the default ref is right.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Pre-install NDK and CMake
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci
        working-directory: ./mobile

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
        working-directory: ./mobile

      # The app talks to the emulator's host loopback over plain HTTP
      # (http://10.0.2.2:8080). Android blocks cleartext by default on API 28+,
      # and only Expo's *debug* manifest opts in — a release build blocks it, so
      # the app's server-reachability probe fails before any request leaves the
      # device and the smoke flow never gets past server setup. This runs a
      # release build (a debug build would load its JS from a Metro dev server
      # that does not exist in CI), so allow cleartext in the generated manifest.
      # This patches only the regenerated CI build; app.json and the production
      # APK (mobile-apk.yml) are untouched.
      - name: Allow cleartext HTTP to the emulator host (CI build only)
        run: |
          manifest=./mobile/android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$manifest"; then
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$manifest"
          fi
          grep -o '<application android:usesCleartextTraffic="[^"]*"' "$manifest"

      - name: Configure gradle.properties
        run: |
          file=./mobile/android/gradle.properties
          # Replace-in-place: expo prebuild writes some of these already, so
          # appending would leave a duplicate key with an ambiguous value.
          set_prop() {
            if grep -q "^$1=" "$file"; then
              sed -i "s|^$1=.*|$1=$2|" "$file"
            else
              printf '%s=%s\n' "$1" "$2" >> "$file"
            fi
          }
          # Build only x86_64 — the emulator's native ABI. -P on the CLI below
          # is authoritative; this keeps the two from disagreeing.
          set_prop reactNativeArchitectures x86_64
          set_prop org.gradle.jvmargs "-Xmx4g -XX:MaxMetaspaceSize=1g"
          set_prop org.gradle.caching true
          set_prop org.gradle.parallel true
          # Required by expo-modules-autolinking's ExpoAutolinkingPlugin; expo
          # prebuild should set it, but set it explicitly to guard against absence.
          set_prop expo.inlineModules.watchedDirectories "[]"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build standalone x86_64 APK
        # -P reactNativeArchitectures is the RN Gradle plugin's documented
        # override and wins over gradle.properties. No signing env vars: the
        # release variant falls back to the generated debug keystore (see the
        # job comment above), so this needs no secrets.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64
        working-directory: ./mobile/android

      - name: Upload e2e APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jot-e2e-apk-x86_64
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: build-apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Hardware acceleration: without this udev rule the emulator falls back to
      # software emulation and is effectively unusable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Maestro is a Gradle-style start script that bundles no JRE — without Java
      # on PATH it dies before running a single flow.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      # mobile/e2e/run.sh builds and starts the Go server as the test fixture.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # run.sh starts the mock IdP (webapp/e2e/fixtures/mock-idp.ts) for the SSO
      # flows. Node runs it directly through built-in type stripping, which
      # needs Node 22.18+; no npm install, it imports only node: built-ins.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Download e2e APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: jot-e2e-apk-x86_64
          path: apk

      # The Maestro pin lives in scripts/check-maestro.sh; read it back rather
      # than duplicate the version here.
      - name: Resolve pinned Maestro version
        id: maestro
        run: |
          version="$(sed -n 's/^MAESTRO_VERSION="\([^"]*\)".*/\1/p' scripts/check-maestro.sh)"
          if [ -z "$version" ]; then
            echo "Could not read MAESTRO_VERSION from scripts/check-maestro.sh" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Maestro
        id: maestro-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.maestro-dist
          key: maestro-${{ steps.maestro.outputs.version }}

      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        # get.maestro.mobile.dev returns 403 through some proxies; the release
        # zip is the reliable source. Pinned — `latest` moved 2.8.0 -> 2.10.0 in
        # under two months.
        run: |
          curl -fsSL -o /tmp/maestro.zip \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${{ steps.maestro.outputs.version }}/maestro.zip"
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro-dist"

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro-dist/maestro/bin" >> "$GITHUB_PATH"

      # Cold boot dominates the job's cost, so restore the AVD from cache when we
      # can. The key encodes the image the snapshot is for — a snapshot for one
      # image is useless for another.
      - name: AVD cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-x86_64-google_apis

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          # -memory/-cores give the emulator headroom: the Maestro driver
          # (uiautomator) is prone to being killed under memory pressure on the
          # stock ~2 GB default, which is a source of the mid-flow driver deaths.
          emulator-options: -memory 4096 -cores 2 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Maestro smoke flow
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          # Match the snapshot job's headroom (see there): more memory/cores
          # keeps the Maestro uiautomator driver from being reaped mid-flow.
          emulator-options: -memory 4096 -cores 2 -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The driver is a committed script, not inline: android-emulator-runner
          # runs this `script` line by line as separate `sh -c` calls and stops
          # at the first failure, which breaks inline control flow, backgrounding
          # and post-failure cleanup. One script invocation is one shell, so the
          # screenrecord, the captured status, and the on-failure diagnostics all
          # work. It installs the APK, runs run.sh, and collects artifacts.
          script: ./mobile/e2e/ci-run.sh

      # What the flows capture with takeScreenshot (the SSO screens, #1016), on
      # every run: the only way to see those screens without an emulator.
      - name: Upload flow screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-e2e-screenshots
          path: mobile/e2e/screenshots/
          retention-days: 14
          if-no-files-found: warn

      # JUnit XML, the screen recording, and Maestro's own per-step
      # screenshots/hierarchy dump — debugging a flow that cannot be reproduced
      # locally without them is impractical, so this is not optional.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-e2e-failure
          path: |
            mobile/e2e/report*.xml
            mobile/e2e/e2e-video.mp4
            mobile/e2e/failure-screenshot.png
            mobile/e2e/ui-hierarchy.xml
            mobile/e2e/logcat.txt
            mobile/e2e/maestro-debug/
          retention-days: 7
          if-no-files-found: warn
