name: Server — CI

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    paths:
      - "server/**"
      # The Go Markdown export is pinned to this fixture too.
      - "shared/src/listToMarkdownCases.json"
      - ".github/workflows/**"
      - "Taskfile.yml"
      - ".golangci.yml"
      - "scripts/**"

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Run tests
        run: task test-server

  # Every server test that can run on Postgres, the HTTP integration suite
  # included. Same task a contributor runs locally; with TEST_POSTGRES_DSN set
  # it uses this service instead of starting its own server.
  test-postgres:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5 # 18-alpine
        env:
          POSTGRES_USER: jot
          POSTGRES_PASSWORD: jot
          POSTGRES_DB: jot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # See internal/database/dsntest: each Postgres-backed test creates and
      # drops its own database on this server, so the base DSN's database
      # name is only used to establish the initial connection.
      TEST_POSTGRES_DSN: postgres://jot:jot@localhost:5432/jot_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Run tests against Postgres
        run: task test-server-postgres

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Run golangci-lint
        run: task lint-server

  docs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: ./.github/actions/setup-task

      # Same task the pre-PR gate runs, so a green `task check` means this job
      # is green too.
      - name: Check docs are up to date
        run: task check-docs

  migrations:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The check lives in a script rather than inline here so it can also run
      # locally as `task check-migrations` — this used to be CI-only, which
      # meant the mistake it catches was undetectable before pushing.
      - name: Check migrations
        run: ./scripts/check-migrations.sh
