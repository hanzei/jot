name: Server — CI

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/**"
      - "Taskfile.yml"
      - ".golangci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 # 18-alpine
        env:
          POSTGRES_USER: jot
          POSTGRES_PASSWORD: jot
          POSTGRES_DB: jot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # See internal/database/dsntest: each Postgres-backed test creates and
      # drops its own database on this server, so the base DSN's database
      # name is only used to establish the initial connection.
      TEST_POSTGRES_DSN: postgres://jot:jot@localhost:5432/jot_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
        with:
          version: 3.x

      - name: Run tests
        run: task test-server

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
        with:
          version: 3.x

      - name: Run golangci-lint
        run: task lint-server

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
        with:
          version: 3.x

      - name: Regenerate docs
        run: task gen-docs

      - name: Check docs are up to date
        run: git diff --exit-code server/docs/

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check migration numbers are unique
        run: |
          set -euo pipefail
          for dialect in sqlite postgres; do
            dupes=$(ls server/internal/database/migrations/${dialect}/*.sql \
              | xargs -I{} basename {} \
              | grep -oP '^\d+' \
              | sort | uniq -d)
            if [ -n "$dupes" ]; then
              echo "Duplicate migration numbers found in ${dialect}: $dupes"
              exit 1
            fi
          done
          echo "All migration numbers are unique."

      - name: Check sqlite and postgres migrations are in sync
        run: |
          set -euo pipefail
          # Every schema change must ship as two files — one per dialect —
          # because each dialect has its own embedded migration tree. A
          # dialect-only migration still passes `task test-server` locally
          # (the Postgres tests skip without TEST_POSTGRES_DSN), so catch it
          # here with an error that names the actual problem.
          # Only top-level *.sql, matching the //go:embed scope in
          # database.go — anything else is not embedded, so a difference
          # there is not a migration mismatch.
          for dialect in sqlite postgres; do
            find server/internal/database/migrations/${dialect}/ \
              -maxdepth 1 -type f -name '*.sql' -exec basename {} \; \
              | sort > "/tmp/migrations-${dialect}.txt"
          done
          if ! diff -u /tmp/migrations-sqlite.txt /tmp/migrations-postgres.txt \
              --label sqlite --label postgres; then
            echo
            echo "sqlite and postgres migration sets differ (see diff above)."
            echo "Every migration needs a matching file with the same name in"
            echo "both server/internal/database/migrations/sqlite/ and"
            echo "server/internal/database/migrations/postgres/."
            exit 1
          fi
          echo "sqlite and postgres migration sets match."
