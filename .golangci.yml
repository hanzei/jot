version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - exhaustive
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnil
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - sqlclosecheck
    - unconvert
    - unused
    - testifylint
    - canonicalheader
    - noctx
    - usestdlibvars
    - durationcheck
    - intrange
    - recvcheck
    - gocognit
    - loggercheck
    - prealloc
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocyclo:
      min-complexity: 20
    goconst:
      min-len: 2
      min-occurrences: 3
      ignore-tests: true
    misspell:
      locale: US
    gocognit:
      min-complexity: 20
    usestdlibvars:
      http-method: true
      http-status-code: true
      http-header: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    testifylint:
      enable:
        - blank-import
        - bool-compare
        - compares
        - contains
        - empty
        - encoded-compare
        - equal-values
        - error-is-as
        - error-nil
        - expected-actual
        - float-compare
        - formatter
        - go-require
        - len
        - negative-positive
        - nil-compare
        - regexp
        - require-error
        - suite-broken-parallel
        - suite-dont-use-pkg
        - suite-extra-assert-call
        - suite-method-signature
        - suite-subtest-run
        - suite-thelper
        - useless-assert

    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# Formatters are reported by `task lint-server` and applied by `task fmt`.
#
# gofmt only, on purpose. It is the language's own format, so it decides
# nothing a Go author has not already agreed to, and the tree was six files
# away from clean when it was enabled.
#
# The ones left out and why:
#   * goimports — would be a good addition, but golangci-lint v2 defaults its
#     local-prefixes to the go.mod module path, so enabling it regroups
#     `github.com/hanzei/jot/...` imports into a trailing block in 72 files.
#     That is a mechanical, zero-risk sweep, but it conflicts with every
#     in-flight branch, so it wants its own commit rather than riding along
#     with an unrelated change. Enable the line below and run `task fmt` when
#     there is a quiet moment.
#   * gofumpt, gci, golines — these rewrite code gofmt already considers
#     correct, which turns edits into diffs the author did not make.
formatters:
  enable:
    - gofmt
    # - goimports
