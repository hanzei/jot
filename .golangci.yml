version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - exhaustive
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnil
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - sqlclosecheck
    - unconvert
    - unused
    - testifylint
    - canonicalheader
    - noctx
    - usestdlibvars
    - durationcheck
    - intrange
    - recvcheck
    - gocognit
    - loggercheck
    - prealloc
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocyclo:
      min-complexity: 20
    goconst:
      min-len: 2
      min-occurrences: 3
      ignore-tests: true
    misspell:
      locale: US
    gocognit:
      min-complexity: 20
    usestdlibvars:
      http-method: true
      http-status-code: true
      http-header: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    testifylint:
      enable:
        - blank-import
        - bool-compare
        - compares
        - contains
        - empty
        - encoded-compare
        - equal-values
        - error-is-as
        - error-nil
        - expected-actual
        - float-compare
        - formatter
        - go-require
        - len
        - negative-positive
        - nil-compare
        - regexp
        - require-error
        - suite-broken-parallel
        - suite-dont-use-pkg
        - suite-extra-assert-call
        - suite-method-signature
        - suite-subtest-run
        - suite-thelper
        - useless-assert

    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# Formatters are reported by `task lint-server` and applied by `task fmt`.
# Together these three cost 11 files to adopt and are idempotent — a second
# `task fmt` is a no-op.
#
#   * gofumpt supersedes gofmt: it is a strict superset, so plain gofmt
#     violations are still caught and there is no need to list gofmt as well.
#     What it adds on top is small and mechanical — mostly collapsing runs of
#     consecutive `var` declarations into one aligned block.
#   * goimports keeps the import block ordered, and adds or drops imports to
#     match what the file actually uses. The second half is why it is here:
#     a stale import otherwise surfaces as a `typecheck` failure instead of
#     being fixed in place.
#   * swaggo aligns the columns of the //	@Param / @Success annotation tables
#     in internal/handlers. Comment whitespace only — verified not to change a
#     byte of the generated server/docs/, which `task check-docs` gates on.
#
# Deliberately not enabled:
#   * gci — overlaps goimports and would fight it over import order. Its extra
#     configurability buys nothing here.
#   * golines — reflows long lines: 105 files and ~8700 lines on this tree, to
#     enforce a line length Go itself declines to have an opinion about.
#
# NOTE: goimports has a `local-prefixes` setting that puts module-local imports
# in their own trailing group. It is off, and turning it on is not a small
# change — it regroups imports in 72 files.
formatters:
  enable:
    - gofumpt
    - goimports
    - swaggo
