version: "3"

tasks:
  # Convenience alias only — on a fresh checkout `task` itself does not exist
  # yet, so the script has to be runnable directly: ./scripts/bootstrap.sh
  bootstrap:
    desc: Provision a checkout - task, npm deps, Playwright's Chromium, Go cache warm-up (idempotent)
    cmd: ./scripts/bootstrap.sh

  run-server:
    desc: Start the Jot server
    dir: server
    vars:
      COMMIT:
        sh: git rev-parse --short HEAD
      BUILD_TIME:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
      LDFLAGS: "-X 'github.com/hanzei/jot/server/internal/server.commit={{.COMMIT}}' -X 'github.com/hanzei/jot/server/internal/server.version=dev' -X 'github.com/hanzei/jot/server/internal/server.buildTime={{.BUILD_TIME}}'"
    env:
      JOT_CORS_ALLOWED_ORIGIN: http://localhost:5173
      JOT_PASSWORD_MIN_LENGTH: "4" # dev only: weak password minimum for local convenience — do not use in production
      JOT_COOKIE_SECURE: "false" # dev only: allows jotctl to work over http://localhost — do not use in production
    cmds:
      - rm -f jot
      - go build -buildvcs=false -ldflags "{{.LDFLAGS}}" -o jot .
      - ./jot

  run-webapp:
    desc: Start webapp dev server with HMR
    dir: webapp
    cmd: npx vite

  # Everything CI enforces except e2e. Each of the three checks below is
  # seconds long and catches a class of failure the lint/test suites cannot
  # see, so they are unconditional rather than something to remember.
  check:
    desc: Pre-PR gate — lint + all tests except e2e, plus the docs/migration/translation gates
    cmds:
      - task: lint
      - task: test
      - task: check-docs
      - task: check-migrations
      - task: check-translations

  check-server:
    desc: Lint, test, and docs/migration-check the server only
    cmds:
      - task: lint-server
      - task: test-server
      - task: check-docs
      - task: check-migrations

  check-webapp:
    desc: Lint, test, and translation-check the webapp only
    cmds:
      - task: lint-webapp
      - task: test-webapp
      - task: check-translations

  check-mobile:
    desc: Lint and test the mobile app only
    cmds:
      - task: lint-mobile
      - task: test-mobile
      - task: check-translations

  check-shared:
    desc: Lint and test the shared package only
    cmds:
      - task: lint-shared
      - task: test-shared

  # Suites run serially rather than as parallel `deps` so a failure is
  # attributable to one suite instead of buried in interleaved output.
  test:
    desc: Run all tests (except e2e)
    cmds:
      - task: test-shared
      - task: test-server
      - task: test-webapp
      - task: test-mobile

  # Every test task forwards {{.CLI_ARGS}}, so a scoped run is
  # `task test-server -- -run TestCreateNote` (note the `--`).
  test-server:
    desc: Run server tests
    dir: server
    cmd: go test {{.CLI_ARGS}} ./...

  test-webapp:
    desc: Run webapp tests
    dir: webapp
    cmd: npm run test:run -- {{.CLI_ARGS}}

  coverage:
    desc: Run server tests with coverage
    dir: server
    cmds:
      # -coverpkg=./... credits the root-package integration suite (http_*_test.go)
      # to the packages it actually exercises. Without it, handlers/auth/mcphandler
      # read as untested.
      - go test -coverpkg=./... -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  # Runs every linter even after one fails, so a single pass reports all of
  # them — see scripts/run-tasks.sh for why `test` above does not do the same.
  lint:
    desc: Run linters (reports every failing suite, not just the first)
    cmd: ./scripts/run-tasks.sh lint-shared lint-server lint-webapp lint-mobile

  lint-server:
    desc: Run server linting with golangci-lint
    dir: server
    cmd: go tool golangci-lint run

  # Every workspace's formatting is reported by its `lint-*` task and applied
  # here, so each rule has one home: golangci-lint's `formatters:` block (see
  # .golangci.yml) for Go, the `semi`/`quotes` ESLint rules for TypeScript.
  # Runs every workspace even after one fails, like `lint` and for the same
  # reason — formatting the whole tree is one pass, not one per rerun.
  fmt:
    desc: Apply formatting (Go and TypeScript)
    cmd: ./scripts/run-tasks.sh fmt-server fmt-shared fmt-webapp fmt-mobile

  fmt-server:
    desc: Apply Go formatting (gofumpt, goimports, swaggo)
    dir: server
    cmd: go tool golangci-lint fmt

  # `--fix-type layout` is what keeps this a formatter: it restricts the fixer
  # to layout rules — which `semi` and `quotes` are, and which none of the
  # correctness rules are — so `task fmt` never rewrites logic on your behalf.
  # Without it, any autofixable rule from the recommended presets would ride
  # along. The run still fails on a lint error it cannot fix, which is
  # `lint-*` telling you about something no formatter was going to solve.
  fmt-shared:
    desc: Apply shared package formatting (semicolons, quotes)
    dir: shared
    cmd: npm run lint -- --fix --fix-type layout

  fmt-webapp:
    desc: Apply webapp formatting (semicolons, quotes)
    dir: webapp
    cmd: npm run lint -- --fix --fix-type layout

  fmt-mobile:
    desc: Apply mobile app formatting (semicolons, quotes)
    dir: mobile
    cmd: npm run lint -- --fix --fix-type layout

  lint-webapp:
    desc: Run webapp linting
    dir: webapp
    cmd: npm run lint && npm run lint:ts

  # `tsc` already catches a *missing* key (src/i18n/index.ts types every locale
  # against en.json), but not a stale extra one, and it does not see the mobile
  # locales at all. Hence a separate gate rather than leaning on lint-webapp.
  check-translations:
    desc: Check that all locale translation files have the same keys as en.json
    dir: webapp
    cmd: npm run check-translations

  check-docs:
    desc: Check the generated Swagger docs are up to date with the handler annotations
    cmds:
      - task: gen-docs
      - cmd: |
          if ! git diff --quiet -- server/docs/; then
            echo
            echo "server/docs/ is stale — regenerated output differs from what is committed."
            echo "The regeneration already ran, so just commit the result:"
            echo "    git add server/docs/"
            git diff --stat -- server/docs/
            exit 1
          fi
          echo "server/docs/ is up to date"

  check-migrations:
    desc: Check migration numbers are unique and the sqlite/postgres trees match
    cmd: ./scripts/check-migrations.sh

  # Catches Expo-governed packages (expo, expo-*, react-native, ...) drifting
  # off the versions SDK 57 expects, plus other native/SDK mismatches (e.g.
  # known Hermes regressions, app-config schema errors) — npm install and the
  # test/typecheck suites all pass on any of these, so nothing else would catch
  # them.
  #
  # Not a gate, and must not be added back to `check`, `check-mobile`, or CI:
  # it resolves what it expects from Expo's SDK manifest at run time, so an
  # upstream patch release turns a green commit red on its own. Owned by
  # .claude/commands/update-mobile-deps.md; run it here on demand.
  check-mobile-expo:
    desc: Run expo-doctor to check mobile's Expo SDK/native alignment (run by update-mobile-deps; not a gate)
    dir: mobile
    cmd: npx expo-doctor

  test-e2e:
    desc: Run end-to-end tests
    dir: webapp
    cmds:
      # bootstrap.sh installs the browser too, so this is normally a no-op —
      # it's the safety net for JOT_BOOTSTRAP_SKIP_PLAYWRIGHT=1 and for
      # reaching test-e2e without ever running bootstrap. Without it, a
      # missing or version-mismatched Chromium surfaces as every spec failing
      # with "Executable doesn't exist at ...".
      - ../scripts/check-playwright-browser.sh
      - task: warm-server-build
      - npm run test:e2e -- {{.CLI_ARGS}}

  # Playwright's webServer runs `go run main.go` under a fixed startup
  # timeout. Compiling the server here first means that step hits a warm
  # build cache instead of racing the timeout on a cold checkout.
  warm-server-build:
    internal: true
    dir: server
    cmd: go build -o /dev/null .

  test-mobile:
    desc: Run mobile app tests
    dir: mobile
    cmd: npm test -- --ci {{.CLI_ARGS}}

  lint-mobile:
    desc: Run mobile app linting
    dir: mobile
    cmd: npm run lint && npm run typecheck

  gen-docs:
    desc: Regenerate Swagger API docs
    dir: server
    cmd: go tool swag init --generalInfo main.go --output docs --parseDependency --parseInternal

  test-shared:
    desc: Run shared package tests
    dir: shared
    cmd: npm run test:run -- {{.CLI_ARGS}}

  lint-shared:
    desc: Run shared package linting
    dir: shared
    cmd: npm run lint && npm run typecheck

  build-webapp:
    desc: Build the webapp into webapp/build (what the server serves in production)
    dir: webapp
    cmd: npm run build

  build-jotctl:
    desc: Build the jotctl admin CLI binary
    dir: server
    vars:
      COMMIT:
        sh: git rev-parse --short HEAD
      BUILD_TIME:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
      LDFLAGS: "-X 'github.com/hanzei/jot/server/cmd/jotctl/cmd.version=dev' -X 'github.com/hanzei/jot/server/cmd/jotctl/cmd.commit={{.COMMIT}}' -X 'github.com/hanzei/jot/server/cmd/jotctl/cmd.buildTime={{.BUILD_TIME}}'"
    cmds:
      - go build -buildvcs=false -ldflags "{{.LDFLAGS}}" -o jotctl ./cmd/jotctl

  clean:
    desc: Remove generated files and node packages
    cmds:
      - rm -rf webapp/build webapp/node_modules
      - rm -rf mobile/node_modules
      - rm -rf shared/node_modules
      - rm -f server/jot server/coverage.out server/coverage.html
