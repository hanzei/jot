# Process-kill persistence, part 3 of 3 (see 07, 08). run.sh disables airplane
# mode before this flow, so the write queued in 07 — which survived the kill in
# 08 — must now drain. This closes the guarantee: not just that the write
# persisted across the kill, but that it still replays cleanly on the next
# reconnect. That it actually reached the server (not just that it still renders
# from the local DB) is proven separately in run.sh, which polls the server API
# for it — the authoritative "actually synced" check.
appId: com.jot.app
---
# No clearState: same account, session, and local database — now with the radio
# back on.
- launchApp

# launchApp cold-restarts the app, so wait for the note to render before
# asserting on the rest rather than racing the boot. It is read from the local
# DB, so it reappears regardless of the network.
- extendedWaitUntil:
    visible: "${MAESTRO_JOT_KILL_NOTE}"
    timeout: 20000

# Back online, so the offline banner has cleared. NetInfo can briefly report
# offline on a cold start, so wait for it to be gone rather than asserting once.
- extendedWaitUntil:
    notVisible:
      id: "offline-banner"
    timeout: 20000

# The write drained without dead-lettering — the regression class from
# #955/#957, where an offline write to a not-yet-synced resource hit a permanent
# 4xx and was dropped rather than queued. A dropped write surfaces as a per-card
# failed badge (note-failed-badge-<id>); assert no card shows one. This is a
# regex over the id, so it matches a badge on any note.
- assertNotVisible:
    id: "note-failed-badge-.*"
