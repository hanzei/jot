# Shared by the SSO flows (12, 15, 16): type IDP_USERNAME into the mock IdP's
# username field and approve. Not a flow of its own — the numbered flows call it
# with runFlow after helpers/mock-idp-page.yaml, passing IDP_USERNAME in env.
#
# The Custom Tab can drop the first keystroke, and the IdP then signs in a
# different user without any flow step failing. So approve only once the field
# holds exactly IDP_USERNAME, and otherwise clear it and retype.
appId: com.jot.app
---
- evalScript: ${output.idpUsernameAttempt = 0}
- retry:
    maxRetries: 2
    commands:
      - evalScript: ${output.idpUsernameAttempt += 1}
      # Tapping the label focuses its input, as in any browser.
      - tapOn: "Username"
      - runFlow:
          when:
            true: ${output.idpUsernameAttempt > 1}
          commands:
            - eraseText: 64
      - inputText: "${IDP_USERNAME}"
      - extendedWaitUntil:
          visible: "${IDP_USERNAME}"
          timeout: 5000
- tapOn: "Approve"
