# Shared by the SSO flows (12-16): tap OPEN_BUTTON_ID (passed in env) to open
# the mock IdP's authorize page in a browser sheet, and wait for the page. Not a
# flow of its own — run.sh never runs it directly; flows 13-14 and
# mock-idp-approve.yaml call it with runFlow.
#
# The sheet is a Chrome Custom Tab, so this is Chrome's UI, not Jot's: Maestro
# reads it through the same accessibility tree, and the page's text (heading,
# label, buttons) is what there is to match on. run.sh asks Chrome to skip its
# first-run screens, but that switch is best-effort, so dismiss them here too
# when they show up anyway.
#
# Chrome has drawn the page without ever exposing its content to accessibility,
# so a retry closes the sheet and opens a fresh one. Back closes it, as in flow
# 14, and only fires while Chrome's url_bar shows, never on Jot's own screen.
# The attempt counter keeps that check off the first attempt, where it would
# only cost an optional-lookup wait.
#
# Chrome can also expose the page only in part: the heading without the form
# (#1041). So the page counts as ready only once its Deny button shows — every
# caller needs the form next, and Deny renders whether or not the field is
# prefilled. Waiting on the heading alone would return on the first attempt and
# leave the caller's next step to time out outside this retry.
appId: com.jot.app
---
- evalScript: ${output.idpPageAttempt = 0}
- retry:
    maxRetries: 2
    commands:
      - evalScript: ${output.idpPageAttempt += 1}
      - runFlow:
          when:
            true: ${output.idpPageAttempt > 1}
          commands:
            - runFlow:
                when:
                  visible:
                    id: "com.android.chrome:id/url_bar"
                commands:
                  - back
                  - extendedWaitUntil:
                      visible:
                        id: "${OPEN_BUTTON_ID}"
                        enabled: true
                      timeout: 20000
      - tapOn:
          id: "${OPEN_BUTTON_ID}"
      - runFlow:
          when:
            visible: "Accept & continue"
          commands:
            - tapOn: "Accept & continue"
      - runFlow:
          when:
            visible: "No thanks"
          commands:
            - tapOn: "No thanks"
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
      - extendedWaitUntil:
          visible: "Deny"
          timeout: 30000
