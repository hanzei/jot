# Shared by the SSO flows (12, 15, 16): open the mock IdP's page with
# OPEN_BUTTON_ID, sign in as IDP_USERNAME, and approve. Not a flow of its own —
# the numbered flows call it with runFlow, passing both in env.
#
# Nothing is typed: the Custom Tab can drop the first keystroke, on every retry
# alike on a slow emulator (#1037). run.sh has the mock IdP prefill the field
# (set_idp_username) before the flow starts, so this only checks the field holds
# exactly IDP_USERNAME before approving — a stale prefill would otherwise sign
# in a different user without any flow step failing.
appId: com.jot.app
---
- runFlow:
    file: mock-idp-page.yaml
    env:
      OPEN_BUTTON_ID: "${OPEN_BUTTON_ID}"
- extendedWaitUntil:
    visible: "${IDP_USERNAME}"
    timeout: 5000
- tapOn: "Approve"
